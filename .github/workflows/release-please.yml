name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Optional: specify the release type (e.g. python, node, simple)
          # Since this is a mixed python/Streamlit project, 'python' or 'simple' works.
          release-type: python
